<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>ORCA LINK / MAID ATELIER</title>
    <style>
      :root {
        --orca-blue: #4b483f;
        --orca-cyan: #20c7e8;
        --orca-ink: #11151b;
        --orca-muted: #778399;
        --orca-line: #2b374824;
        --orca-surface: #fdfaf4;
      }
      * { border-radius: 0 !important; box-sizing: border-box; }
      body {
        width: 276px;
        margin: 0;
        padding: 12px;
        background: var(--orca-surface);
        color: var(--orca-ink);
        font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
      }
      h1 {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 0 0 10px;
        font-size: 11px;
        letter-spacing: 0.28em;
        color: var(--orca-blue);
      }
      h1::before { content: ''; width: 10px; height: 10px; background: var(--orca-cyan); }
      .skins { display: flex; gap: 6px; margin-bottom: 10px; }
      .skin {
        flex: 1;
        padding: 8px 4px;
        border: 1px solid var(--orca-line);
        background: transparent;
        color: var(--orca-ink);
        font: inherit;
        font-size: 10px;
        letter-spacing: 0.08em;
        cursor: pointer;
      }
      .skin[data-active] {
        border-color: var(--orca-cyan);
        box-shadow: inset 0 0 0 1px var(--orca-cyan);
        font-weight: 700;
      }
      .skin small { display: block; color: var(--orca-muted); font-size: 9px; letter-spacing: 0; }
      label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 6px 8px;
        border: 1px solid var(--orca-line);
        margin-bottom: 6px;
        cursor: pointer;
      }
      label:hover { border-color: color-mix(in srgb, var(--orca-cyan) 60%, transparent); }
      input[type='checkbox'] { width: 14px; height: 14px; accent-color: var(--orca-cyan); }
      .hint { margin: 10px 0 0; color: var(--orca-muted); font-size: 10px; line-height: 1.6; }
      .row { display: flex; gap: 6px; margin-top: 10px; }
      .row button {
        flex: 1;
        padding: 6px;
        border: 1px solid var(--orca-line);
        background: transparent;
        color: var(--orca-ink);
        font: inherit;
        cursor: pointer;
      }
      .row button:hover { border-color: var(--orca-cyan); }
      .section { margin: 12px 0 6px; color: var(--orca-muted); font-size: 10px; letter-spacing: 0.2em; }
    </style>
  </head>
  <body>
    <h1>SKIN</h1>
    <div class="skins">
      <button class="skin" data-skin="orca">ORCA LINK<small>虎鲸链路</small></button>
      <button class="skin" data-skin="maid">MAID ATELIER<small>深海女仆工坊</small></button>
    </div>

    <div class="section">显示项</div>
    <label><span>双场景动态背景</span><input type="checkbox" id="scene" /></label>
    <label><span>状态角色<span style="color: var(--orca-muted)">（仅虎鲸）</span></span><input type="checkbox" id="character" /></label>
    <label title="正常情况下不需要；站点改版后背景被盖住时打开">
      <span>背景兜底透明化</span><input type="checkbox" id="reveal" />
    </label>

    <div class="row">
      <button id="reset-pos">重置位置</button>
      <button id="reload">重载页面</button>
    </div>
    <p class="hint">
      切换皮肤**即时生效**，无需刷新（宫殿背景、双立绘与整站配色一起换）。<br />
      美术素材 CC BY-NC-SA 4.0，禁止商用：虎鲸链路 一创上善／二创 Small-tailqwq；深海女仆工坊 一创上善／二创 ZipZipPipe／三创 Small-tailqwq。
    </p>
    <script src="popup.js"></script>
  </body>
</html>
